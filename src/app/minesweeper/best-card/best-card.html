<div class="info-card best-card">
  <div class="info-card-heading">
    <span class="heading-icon" aria-hidden="true">✦</span>
    <span>Your best</span>
    <span class="sparkle" aria-hidden="true">✧</span>
  </div>
  <div class="best-time mono">{{ bestTimeLabel() }}</div>
  <p>{{ bestCopy() }}</p>
  <div class="best-meter">
    <span [style.width.%]="meterPercent()"></span>
  </div>
</div>
