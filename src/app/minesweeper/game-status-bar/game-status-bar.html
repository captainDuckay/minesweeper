<div class="game-card-topline">
  <div class="stat-block">
    <span class="stat-label">Mines left</span>
    <strong class="stat-value mono">{{ minesLeft() }}</strong>
  </div>
  <span class="status-pill" role="status" aria-live="polite" [attr.data-status]="status()">
    <span class="status-dot"></span>
    <span>{{ statusLabel() }}</span>
  </span>
  <div class="stat-block stat-block-right">
    <span class="stat-label">Time</span>
    <strong class="stat-value mono">{{ elapsed() }}</strong>
  </div>
</div>
