<mine-game-status-bar
  [minesLeft]="minesLeft()"
  [elapsed]="elapsed()"
  [status]="status()"
  [statusLabel]="statusLabel()"
/>
<div class="board-frame">
  <div class="board-wrap">
    <mine-board class="board" />
    @if (paused()) {
      <div class="pause-overlay">
        <span class="pause-symbol" aria-hidden="true">Ⅱ</span>
        <strong>Game paused</strong>
        <span>Take a breath, then pick up where you left off.</span>
      </div>
    }
  </div>
</div>
<mine-game-controls
  [message]="statusMessage()"
  [flagMode]="flagMode()"
  [paused]="paused()"
  [pauseEnabled]="pauseEnabled()"
  (flagModeToggle)="flagModeToggle.emit()"
  (pauseToggle)="pauseToggle.emit()"
/>
